[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyokbot"
version = "0.1.0"
description = "A Python library for creating bots in Odnoklassniki (ok.ru) messenger via WebSocket"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Vanus"}
]
keywords = ["ok.ru", "odnoklassniki", "bot", "messenger", "websocket", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp",
    "requests",
    "websockets",
    "munch",
    "selectolax",
    "sulguk",
]

[project.urls]
Homepage = "https://github.com/SangoAlgo/pyokbot"
Source = "https://github.com/SangoAlgo/pyokbot"
BugTracker = "https://github.com/SangoAlgo/pyokbot/issues"
Documentation = "https://SangoAlgo.github.io/pyokbot"

[tool.setuptools.packages.find]
include = ["pyokbot*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
